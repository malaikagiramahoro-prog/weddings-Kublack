<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Our Team — Weddings by Kublack</title>
<meta name="description" content="Meet the people behind Weddings by Kublack." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="team">

  <section class="page-banner page-banner--small">
    <img class="page-banner__image" src="images\image9.jpg.jpeg" alt="Weddings by Kublack team" />
    <div class="page-banner__scrim"></div>
    <div class="page-banner__content container">
      <span class="eyebrow" style="color:#fff;" data-en="Our Team" data-fr="Notre Équipe">Our Team</span>
    </div>
  </section>

  <section class="section--tight team">
    <div class="container">
      <div class="team-intro">
        <p data-en="The people behind the lens, working together to tell your story." data-fr="Les personnes derrière l'objectif, unies pour raconter votre histoire.">The people behind the lens, working together to tell your story.</p>
      </div>
      <div class="team-grid">

        <div class="team-member">
          <div class="team-member__photo">
            <img src="images\image_9544.PNG" alt="Team member" onerror="this.style.display='none'">
          </div>
          <div class="team-member__info">
            <h3>Louis de Gonzague (Ku Black)</h3>
            <span class="eyebrow">Founder&Lead Photographer</span>
          </div>
        </div>

        <div class="team-member">
          <div class="team-member__photo">
            <img src="images\image_9543.PNG" alt="Team member" onerror="this.style.display='none'">
          </div>
          <div class="team-member__info">
            <h3>Axel Paterne (Mboka)</h3>
            <span class="eyebrow">Lead Photographer</span>
          </div>
        </div>

        <div class="team-member">
          <div class="team-member__photo">
            <img src="images\image_9545.PNG" alt="Team member" onerror="this.style.display='none'">
          </div>
          <div class="team-member__info">
            <h3>Denys Uwimana</h3>
            <span class="eyebrow">Videographer</span>
          </div>
        </div>

        <div class="team-member">
          <div class="team-member__photo">
            <img src="images\image_9546.PNG" alt="Team member" onerror="this.style.display='none'">
          </div>
          <div class="team-member__info">
            <h3>Eric Ingabikwiye</h3>
            <span class="eyebrow">Videographer</span>
          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="script.css"></script>
</body>
</html>
