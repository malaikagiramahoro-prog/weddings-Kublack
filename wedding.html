  <script src="script.css"></script>
  <script>
    // Distribute masonry photos evenly across column wrappers (avoids the
    // empty-column gap that pure CSS column-balance can produce).
    (function () {
      var grid = document.querySelector('.masonry-grid');
      if (!grid) return;
      var items = Array.prototype.slice.call(grid.children);

      function columnsForWidth() {
        var w = window.innerWidth;
        if (w <= 560) return 1;
        if (w <= 900) return 2;
        return 3;
      }

      function layout() {
        var count = columnsForWidth();
        var cols = [];
        for (var i = 0; i < count; i++) {
          var col = document.createElement('div');
          col.className = 'masonry-col';
          cols.push(col);
        }
        // Round-robin: guarantees every column gets a fair, even share
        items.forEach(function (item, i) {
          cols[i % count].appendChild(item);
        });
        grid.innerHTML = '';
        cols.forEach(function (col) { grid.appendChild(col); });
      }

      layout();

      var resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layout, 200);
      });
    })();
  </script>
