<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gallery — Weddings by Kublack</title>
<meta name="description" content="Browse the work — weddings and films by Weddings by Kublack." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="gallery">

  <section class="page-banner">
    <img class="page-banner__image" src="images/image6.jpg.jpeg" alt="Gallery cover" />
    <div class="page-banner__scrim"></div>
    <div class="page-banner__content container">
      <span class="eyebrow" style="color:#fff;" data-en="Gallery" data-fr="Galerie">Gallery</span>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="gallery-categories gallery-categories--duo">

        <a class="gallery-category" href="wedding.html">
          <div class="gallery-category__frame">
            <div class="cover-overlay"><span data-en="View Gallery" data-fr="Voir la Galerie">View Gallery</span></div>
            <img src="images/IMG_9549.PNG" alt="Weddings" onerror="this.style.display='none'">
          </div>
          <div class="gallery-category__label">
            <h3 data-en="Weddings" data-fr="Mariages">Weddings</h3>
            <p data-en="Full-day coverage of your ceremony and celebration." data-fr="Couverture complète de votre cérémonie et de votre célébration.">Full-day coverage of your ceremony and celebration.</p>
            <span class="gallery-category__link" data-en="View Gallery →" data-fr="Voir la Galerie →">View Gallery →</span>
          </div>
        </a>

        <a class="gallery-category" href="videos.html">
          <div class="gallery-category__frame">
            <div class="cover-overlay"><span data-en="View Gallery" data-fr="Voir la Galerie">View Gallery</span></div>
            <img src="images/IMG_9550.PNG" alt="Films" onerror="this.style.display='none'">
          </div>
          <div class="gallery-category__label">
            <h3 data-en="Films" data-fr="Films">Films</h3>
            <p data-en="Motion and sound, for days that deserve more than stills." data-fr="Mouvement et son, pour des journées qui méritent plus que des photos.">Motion and sound, for days that deserve more than stills.</p>
            <span class="gallery-category__link" data-en="View Gallery →" data-fr="Voir la Galerie →">View Gallery →</span>
          </div>
        </a>

      </div>
    </div>
  </section>

  <script src="script.css"></script>

</html>
